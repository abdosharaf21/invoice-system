# E-Invoice & Reconciliation System — production Nginx configuration
#
# Topology:  public 80/443  ->  nginx  ->  Gunicorn (127.0.0.1:8000)  ->  MySQL
#
# Place this file at /etc/nginx/conf.d/e-invoice.conf (or symlink it into
# /etc/nginx/sites-enabled/). Adjust the paths to match your deployment.
# Validate with:  nginx -t
#
# The frontend is served directly by Nginx (static files, no build step).
# All /api/* traffic is proxied to Gunicorn.
#
# "Verified" remainder: the server block below is generic and has been
#   syntax-checked; the TLS portion requires a real certificate and domain
#   and must be enabled on the actual production host.

server {
    # --- TLS (REQUIRES a real certificate + domain; see DEPLOYMENT.md) ---------
    # listen 443 ssl http2;
    # server_name invoice.example.com;
    #
    # ssl_certificate     /etc/letsencrypt/live/invoice.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/invoice.example.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    # --- Plain HTTP (single-box / internal; redirect to HTTPS when TLS on) ----
    listen 80;
    server_name invoice.example.com;

    # Redirect cleartext to HTTPS once TLS is configured.
    # return 301 https://$host$request_uri;

    root /opt/e-invoice/frontend;
    index index.html;

    # --- API reverse proxy -----------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  90s;
        proxy_send_timeout  90s;
        proxy_connect_timeout 10s;
        # Uploads: backend enforces MAX_CONTENT_LENGTH (10 MB); Nginx is the
        # first line so oversize requests are rejected before reaching Flask.
        client_max_body_size 12m;
    }

    # Dedicated health check (also used by systemd/uptime probes).
    location = /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- Frontend static assets ------------------------------------------
    # index.html served from the SPA root; never cached.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # Assets (JS/CSS) — content-addressed by rebuild; cache aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }

    # Hash-based routing: falls back to the SPA entry document.
    location / {
        try_files $uri /index.html;
    }

    # --- Security headers (defense in depth next to the app's own headers) ----
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # Enable after HTTPS is active; keep in sync with the app's HSTS_ENABLED.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --- Logging ----------------------------------------------------------
    access_log /var/log/nginx/e-invoice_access.log;
    error_log  /var/log/nginx/e-invoice_error.log;
}